{% extends "base.html" %}

{% block content %}

<!-- 🔹 HEADING ROW -->
<div class="row mb-4">
    <div class="col-12 text-center">
        <h1 class="fs-4">These are your Notes:</h1>
    </div>
</div>

<!-- 🔹 NOTES CARDS ROW -->
<div class="row">
{% for note in notes %}
    <div class="col-md-4 mb-3">
        <div class="card h-100">
            <div class="card-header">
                {{ note.title }}
            </div>

            <div class="card-body">
                <p>{{ note.text|truncatewords:10 }}</p>
            </div>

            <div class="card-footer text-end">
                <a href="{% url 'notes:detail' note.id %}"
                   class="btn btn-info btn-sm">
                    View Note
                </a>
            </div>
        </div>
    </div>
{% empty %}
    <div class="col-12 text-center">
        <p>No notes available.</p>
    </div>
{% endfor %}
</div>

{% endblock %}
