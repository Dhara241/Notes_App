{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">

        <div class="card shadow-sm">
            <div class="card-body">

                <h3 class="text-center mb-4">Create Note</h3>

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        {{ form.title.label_tag }}
                        {{ form.title }}
                    </div>

                    <div class="mb-3">
                        {{ form.text.label_tag }}
                        {{ form.text }}
                    </div>

                    <div class="text-center">
                        <button type="submit" class="btn btn-success px-4">
                            Submit
                        </button>
                    </div>
                </form>

                <!-- ✅ ADD HERE -->
                <div class="text-end mt-3">
                    <a href="{% url 'notes:list' %}" class="btn btn-outline-primary btn-sm">
                        Back to Notes
                    </a>
                </div>

                {% if form.errors %}
                    <div class="alert alert-danger mt-3">
                        {{ form.errors }}
                    </div>
                {% endif %}

            </div>
        </div>

    </div>
</div>
{% endblock %}
