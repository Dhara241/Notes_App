{% extends "base.html" %}
{% load static %}


{% block content %}

<div class="row justify-content-center mt-5">
    <div class="col-md-6 mx-auto">
        <div class="card">
            <div class="card-header">Login</div>

                    {% csrf_token %}
                    {{ form.as_p }}

            </div>
        </div>
    </div>      
</div>



{% endblock %}
