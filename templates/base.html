{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Notes App</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>

<!-- ✅ NAVBAR -->
<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" href="/">My Notes App</a>

    <!-- RIGHT CORNER BUTTONS -->
    <div class="ms-auto">
        {% if user.is_authenticated %}
            <a href="{% url 'notes:list' %}" class="btn btn-outline-light btn-sm me-2">
                Home
            </a>

            <a href="{% url 'notes:new' %}" class="btn btn-outline-light btn-sm me-2">
                Create
            </a>

            <form method="post" action="{% url 'logout' %}" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-light btn-sm">
                    Logout
                </button>
            </form>
        {% else %}
            <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm me-2">
                Login
            </a>

            <a href="{% url 'signup' %}" class="btn btn-outline-light btn-sm">
                Signup
            </a>
        {% endif %}
    </div>
</nav>
<!-- ✅ NAVBAR END -->

<div class="container my-5">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
